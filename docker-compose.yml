services:
  ros2:
    container_name: interplanetar_26
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      - .:/ros2_ws
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    stdin_open: true
    tty: true
    ipc: host
    privileged: true
